name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Giai nen file code
      run: unzip VLESSRealityDemo.zip

    - name: Tien hanh Build APK
      run: |
        cd VLESSRealityDemo
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Xuat file APK
      uses: actions/upload-artifact@v4
      with:
        name: Ung-dung-cua-ban
        path: VLESSRealityDemo/app/build/outputs/apk/debug/app-debug.apk
